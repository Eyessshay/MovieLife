server:
  port: 8081

spring:
  application:
    name: movielife-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/movielife?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    timeout: 3s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    org.springframework.web.client.RestTemplate: INFO
    org.springframework.http.converter: INFO

movielife:
  auth:
    log-code-enabled: ${AUTH_LOG_CODE_ENABLED:false}
  startup-check:
    enabled: ${STARTUP_CHECK_ENABLED:true}
  ai:
    review-summary:
      enabled: ${AI_REVIEW_SUMMARY_ENABLED:false}
      endpoint: ${AI_REVIEW_SUMMARY_ENDPOINT:}
      api-key: ${AI_REVIEW_SUMMARY_API_KEY:}
      model: ${AI_REVIEW_SUMMARY_MODEL:}
      connect-timeout: ${AI_REVIEW_SUMMARY_CONNECT_TIMEOUT:3s}
      read-timeout: ${AI_REVIEW_SUMMARY_READ_TIMEOUT:45s}
      max-response-bytes: ${AI_REVIEW_SUMMARY_MAX_RESPONSE_BYTES:16384}
      min-reviews: ${AI_REVIEW_SUMMARY_MIN_REVIEWS:3}
      max-reviews: ${AI_REVIEW_SUMMARY_MAX_REVIEWS:100}
      max-review-characters: ${AI_REVIEW_SUMMARY_MAX_REVIEW_CHARACTERS:1000}
      max-input-characters: ${AI_REVIEW_SUMMARY_MAX_INPUT_CHARACTERS:20000}
      max-attempts: ${AI_REVIEW_SUMMARY_MAX_ATTEMPTS:3}
      lease-duration: ${AI_REVIEW_SUMMARY_LEASE_DURATION:2m}
      stream-batch-size: ${AI_REVIEW_SUMMARY_STREAM_BATCH_SIZE:10}
      retry-batch-size: ${AI_REVIEW_SUMMARY_RETRY_BATCH_SIZE:100}
      worker-fixed-delay-ms: ${AI_REVIEW_SUMMARY_WORKER_FIXED_DELAY_MS:1000}
      worker-initial-delay-ms: ${AI_REVIEW_SUMMARY_WORKER_INITIAL_DELAY_MS:5000}
      retry-fixed-delay-ms: ${AI_REVIEW_SUMMARY_RETRY_FIXED_DELAY_MS:5000}
      retry-initial-delay-ms: ${AI_REVIEW_SUMMARY_RETRY_INITIAL_DELAY_MS:5000}
